[build-system]
requires = ["maturin>=1.13"]
build-backend = "maturin"

[project]
name = "crc32-rs"
requires-python = ">=3.12"
description = "A fast CRC-32 library for Python, powered by Rust."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Harmouch", email = "oss@wiseai.dev" }]
keywords = ["crc32", "checksum", "hash", "zlib", "rust"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wiseaidev/crc32-v2"
Repository = "https://github.com/wiseaidev/crc32-v2"
Documentation = "https://docs.rs/crc32-v2"
Issues = "https://github.com/wiseaidev/crc32-v2/issues"

[tool.maturin]
features = ["python"]
module-name = "crc32_v2._crc32_v2"
python-source = "python"
